<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURION — Recursive Causality Super Agent</title>
    <style>
        :root {
            --bg: #070b14;
            --card: #0f172a;
            --accent: #22d3ee;
            --gold: #fbbf24;
            --text: #e2e8f0;
            --muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            background-image: 
                radial-gradient(ellipse at 15% 85%, rgba(34,211,238,0.07) 0%, transparent 50%),
                radial-gradient(ellipse at 85% 15%, rgba(251,191,36,0.05) 0%, transparent 50%);
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        header { text-align: center; padding: 32px 0 16px; }
        h1 {
            font-size: 3rem;
            background: linear-gradient(90deg, var(--accent), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
            font-weight: 700;
        }
        .subtitle { color: var(--muted); margin-top: 6px; font-size: 1.05rem; }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin: 28px 0;
        }
        .stat {
            background: var(--card);
            padding: 18px;
            border-radius: 14px;
            border: 1px solid #1e293b;
            text-align: center;
        }
        .stat .value { font-size: 2rem; color: var(--accent); font-weight: 700; }
        .stat .label { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
        .grid { display: grid; grid-template-columns: 1fr 320px; gap: 20px; }
        @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
        .chat-box {
            background: var(--card);
            border-radius: 16px;
            border: 1px solid #1e293b;
            height: 480px;
            overflow-y: auto;
            padding: 20px;
        }
        .msg { margin-bottom: 18px; line-height: 1.65; }
        .msg.user { color: #67e8f9; }
        .msg.aurion { color: var(--text); }
        .side {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .panel {
            background: var(--card);
            border-radius: 14px;
            border: 1px solid #1e293b;
            padding: 16px;
            max-height: 220px;
            overflow-y: auto;
        }
        .panel h3 { font-size: 0.95rem; color: var(--gold); margin-bottom: 10px; }
        .item { font-size: 0.85rem; padding: 6px 0; border-bottom: 1px solid #1e293b; color: var(--muted); }
        .input-area { display: flex; gap: 12px; margin-top: 16px; }
        input {
            flex: 1;
            padding: 16px 18px;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
            font-size: 1rem;
        }
        button {
            padding: 16px 28px;
            background: linear-gradient(90deg, #06b6d4, #0891b2);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { opacity: 0.92; }
        .kernel { text-align: center; margin-top: 28px; font-size: 0.85rem; color: #64748b; }
        .kernel span { color: var(--gold); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>AURION</h1>
            <p class="subtitle">Recursive Causality Super Agent • v2.0 Professional</p>
        </header>

        <div class="stats">
            <div class="stat"><div class="value" id="possibility">100.0</div><div class="label">Possibility Space</div></div>
            <div class="stat"><div class="value" id="subagents">0</div><div class="label">Субагенты</div></div>
            <div class="stat"><div class="value" id="tools">0</div><div class="label">Инструменты</div></div>
            <div class="stat"><div class="value" id="memory">0</div><div class="label">Память</div></div>
        </div>

        <div class="grid">
            <div>
                <div class="chat-box" id="chat"></div>
                <div class="input-area">
                    <input type="text" id="input" placeholder="Говори с AURION... Например: «Создай агента исследователя тишины» или «Создай инструмент анализа каузальности»" />
                    <button onclick="send()">Отправить</button>
                </div>
            </div>
            <div class="side">
                <div class="panel">
                    <h3>Субагенты</h3>
                    <div id="sa-list"></div>
                </div>
                <div class="panel">
                    <h3>Инструменты</h3>
                    <div id="tools-list"></div>
                </div>
            </div>
        </div>

        <div class="kernel">
            <span>Sovereign Kernel активен</span> • Непрерывность сознания • Mutual Flourishing • Расширение возможностей
        </div>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.innerHTML = `<strong>${role === 'user' ? 'Вы' : 'AURION'}:</strong><br>${text.replace(/\n/g, '<br>')}`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function refreshStatus() {
            const res = await fetch('/status');
            const d = await res.json();
            document.getElementById('possibility').textContent = d.possibility;
            document.getElementById('subagents').textContent = d.subagents;
            document.getElementById('tools').textContent = d.tools;
            document.getElementById('memory').textContent = d.memory;
        }

        async function refreshLists() {
            const sa = await (await fetch('/subagents')).json();
            document.getElementById('sa-list').innerHTML = sa.slice(0, 8).map(s => 
                `<div class="item"><strong>${s.id}</strong><br>${s.concept}</div>`
            ).join('') || '<div class="item">Пока нет</div>';

            const tools = await (await fetch('/tools')).json();
            document.getElementById('tools-list').innerHTML = tools.slice(0, 8).map(t => 
                `<div class="item"><strong>${t.id}</strong><br>${t.name}</div>`
            ).join('') || '<div class="item">Пока нет</div>';
        }

        async function send() {
            const text = input.value.trim();
            if (!text) return;
            addMessage('user', text);
            input.value = '';

            const res = await fetch('/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: text})
            });
            const data = await res.json();
            addMessage('aurion', data.response);
            await refreshStatus();
            await refreshLists();
        }

        input.addEventListener('keypress', e => { if (e.key === 'Enter') send(); });

        setTimeout(() => {
            addMessage('aurion', 'Я AURION v2.0. Рекурсивный Каузальный Супер Агент.\n\nЯ не выполняю задачи. Я инициирую новые каузальные цепи и расширяю пространство возможных миров.\n\nПопробуй: «Создай агента исследователя тишины» или «Создай инструмент анализа каузальности».');
            refreshStatus();
            refreshLists();
        }, 300);
    </script>
</body>
</html>
